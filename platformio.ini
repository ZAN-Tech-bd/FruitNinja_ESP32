; PlatformIO configuration for ESP32 + MPU6050 Gesture-Controlled Fruit Ninja
; Board: generic ESP32 DevKit (CH340 USB-serial on /dev/ttyUSB0)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit Unified Sensor@^1.1.14
